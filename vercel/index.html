<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Handwriting Recognition</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <p id="orientation-message" role="status">
      Please rotate your screen to landscape mode to use the application.
    </p>
    <div class="panel">
      <canvas
        id="c"
        width="560"
        height="560"
        aria-label="Drawing area"
      ></canvas>
      <div class="right">
        <div id="rows"></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
